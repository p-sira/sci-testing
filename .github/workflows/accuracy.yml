name: Accuracy reports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: accuracy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sci-testing
    steps:
      - uses: actions/checkout@v7
        with:
          path: sci-testing
          submodules: recursive
      - name: Check pinned Sci revision
        run: test "$(git -C sci rev-parse HEAD)" = "$(cat sci-revision.txt)"
      - uses: ./sci-testing/sci/.github/actions/setup-native
      - name: Install comparison libraries
        run: sudo apt-get install --yes libboost-math-dev libgsl-dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install tools and dependencies
        run: |
          python -m pip install uv==0.13.1
          rustup update stable
          rustup default stable
          uv sync --frozen
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sci-testing
      - name: Check Rust formatting and public API evaluation
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo build --locked
      - name: Check independent references and Rust writer interoperability
        run: |
          runner_dir="$(cargo metadata --locked --format-version 1 --no-deps | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          runner="$runner_dir/debug/sci-testing"
          test -x "$runner"
          SCI_TESTING_IO_RUNNER="$runner" SCI_TESTING_COMPLEX_RUNNER="$runner" uv run --frozen python -m unittest -v
      - name: Lint Rust adapters
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify Rust documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps
      - name: Validate pinned references, coverage and generated tables
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            uv run --frozen python -m sci_testing.report --check --exhaustive
          else
            uv run --frozen python -m sci_testing.report --check
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: accuracy-reports
          if-no-files-found: error
          path: |
            sci-testing/docs/accuracy/
            sci-testing/results/coverage.csv
            sci-testing/results/environment.json
            sci-testing/results/accuracy-summaries.json
