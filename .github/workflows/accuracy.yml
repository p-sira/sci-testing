name: Accuracy reports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sci-testing
    steps:
      - uses: actions/checkout@v7
        with:
          path: sci-testing
      - name: Read pinned Sci revision
        id: sci
        run: |
          revision=$(cat sci-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: p-sira/sci
          ref: ${{ steps.sci.outputs.revision }}
          path: sci
      - uses: ./sci/.github/actions/setup-native
      - name: Install comparison libraries
        run: sudo apt-get install --yes libboost-math-dev libgsl-dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install tools and dependencies
        run: |
          python -m pip install uv==0.13.1
          rustup update stable
          rustup default stable
          uv sync --frozen
      - name: Check input recipes, metrics and adapters
        run: uv run --frozen python -m unittest -v
      - name: Check Rust input parsing and public API evaluation
        run: cargo test --locked
      - name: Generate all tables and validate generated files
        run: |
          uv run --frozen python -m sci_testing.report
          uv run --frozen python -m sci_testing.report --check
      - uses: actions/upload-artifact@v7
        with:
          name: accuracy-reports
          if-no-files-found: error
          path: |
            sci-testing/docs/accuracy/
            sci-testing/cases/
            sci-testing/results/
